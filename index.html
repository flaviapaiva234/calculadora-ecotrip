<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EcoTrip - Calculadora de Carbono</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">
        <header style="text-align: center; position: relative;">
            <h1 style="margin: 0; display: flex; flex-direction: column; align-items: center;">
                <span>Calculadora</span>
                <span>EcoTrip 🌱</span>
            </h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema"
                style="position: absolute; top: 10px; right: 20px; width: 48px; height: 48px; padding: 0;">🌙</button>
            <p>Simule o impacto ambiental da sua viagem</p>
        </header>

        <main>
            <form id="carbon-form">
                <div class="form-group">
                    <label for="origem">Origem (opcional):</label>
                    <input type="text" id="origem" name="origem" placeholder="Ex: São Paulo, SP">
                </div>

                <div class="form-group">
                    <label for="destino">Destino (opcional):</label>
                    <input type="text" id="destino" name="destino" placeholder="Ex: Rio de Janeiro, RJ">
                </div>

                <div class="form-group">
                    <label for="distancia">Distância (km):</label>
                    <input type="number" id="distancia" name="distancia" step="0.1" placeholder="Distância em km"
                        required>
                </div>

                <div class="form-group">
                    <label>🌍 Meio de transporte:</label>
                    <div id="transport-cards" class="transport-cards"></div>
                    <!-- Campo oculto para armazenar o transporte selecionado (usado pelo JS) -->
                    <input type="hidden" id="transporte" name="transporte" value="carro">
                </div>

                <button type="submit" id="calcular-btn">Calcular emissão de CO₂</button>
            </form>

            <!-- Resultado detalhado -->
            <div id="resultado" class="resultado-detalhado" style="display: none;">
                <div class="resultado-header">
                    <div><strong>🚀 Rota:</strong> <span id="rota-info">---</span></div>
                    <div><strong>📏 Distância:</strong> <span id="distancia-info">--</span> km</div>
                </div>
                <h3>🌿 Emissão de CO₂</h3>
                <p id="emissao">-- kg CO₂</p>
                <p id="dica" class="dica-ecologica"></p>

                <h3>📊 Comparação com outros meios de transporte</h3>
                <div id="comparacao-tabela"></div>
            </div>
        </main>

        <footer>
            <p>💡 Dica: Quanto menor a emissão, melhor para o planeta!</p>
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
